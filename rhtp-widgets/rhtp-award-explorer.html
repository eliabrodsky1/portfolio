<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
.rhtp{--bg:#ffffff;--ink:#121212;--ink2:#4a4f57;--ink3:#767c86;--rule:#e2e4e8;--soft:#f3f4f6;--accent:#1f62a8;--accent-soft:#9db9da;
  --rep:#c8473d;--dem:#2f6fb5;--gain:#1f62a8;--loss:#c2540a;--tip-bg:#ffffff;--tip-shadow:0 6px 24px rgba(15,23,42,.14);--nodata:#e9ebee;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.rhtp[data-theme="dark"]{--bg:#141516;--ink:#f1f2f3;--ink2:#b4b9c1;--ink3:#8a909a;--rule:#2c2f33;--soft:#1f2124;--accent:#6aa9ea;--accent-soft:#3f5f85;
  --rep:#e5756b;--dem:#62a3e6;--gain:#6aa9ea;--loss:#e8935a;--tip-bg:#202327;--tip-shadow:0 6px 24px rgba(0,0,0,.5);--nodata:#26292d}
html,body{margin:0;background:transparent}
.rhtp{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;max-width:980px;margin:0 auto;padding:22px 22px 16px;box-sizing:border-box;position:relative;-webkit-font-smoothing:antialiased}
.rhtp *{box-sizing:border-box}
.rhtp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.rhtp h1{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.15;margin:0 0 6px;letter-spacing:-.2px}
.rhtp .dek{color:var(--ink2);font-size:15px;margin:0;max-width:680px}
.rhtp .theme{font:inherit;font-size:12px;color:var(--ink2);background:none;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.rhtp .theme:hover{color:var(--ink);border-color:var(--ink3)}
.rhtp-tabs{display:flex;gap:26px;border-bottom:1px solid var(--rule);margin-top:18px}
.rhtp-tabs button{font:inherit;font-size:14px;font-weight:600;color:var(--ink3);background:none;border:0;border-bottom:2px solid transparent;padding:10px 0 9px;margin-bottom:-1px;cursor:pointer}
.rhtp-tabs button:hover{color:var(--ink)}
.rhtp-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.rhtp-controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 22px;padding:14px 0 6px}
.rhtp-controls label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3)}
.rhtp select{font:inherit;font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:7px 30px 7px 10px;appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.rhtp .seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.rhtp .seg button{font:inherit;font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink2);background:var(--bg);border:0;border-left:1px solid var(--rule);padding:7px 12px;cursor:pointer}
.rhtp .seg button:first-child{border-left:0}
.rhtp .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rhtp .takeaway{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.3;margin:12px 0 2px}
.rhtp .note{color:var(--ink2);font-size:13px;margin:0 0 8px;min-height:18px}
.rhtp .stage{position:relative}
.rhtp svg{display:block;width:100%;height:auto;overflow:visible}
.rhtp svg text{font-family:var(--sans);fill:var(--ink2);font-size:12px}
.rhtp .barwrap{max-height:520px;overflow-y:auto;padding-right:4px}
.rhtp .legend{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);margin:2px 0 6px;flex-wrap:wrap}
.rhtp .legend .ramp{display:flex;height:10px;width:200px;border-radius:2px;overflow:hidden}
.rhtp .legend .ramp i{flex:1}
.rhtp .legend .key{display:inline-flex;align-items:center;gap:6px;margin-right:8px}
.rhtp .legend .key b{width:10px;height:10px;border-radius:50%;display:inline-block}
.rhtp .tip{position:absolute;pointer-events:none;background:var(--tip-bg);color:var(--ink);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--tip-shadow);padding:11px 13px 10px;min-width:190px;max-width:260px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:5}
.rhtp .tip.on{opacity:1;transform:none}
.rhtp .tip h3{font-family:var(--serif);font-weight:700;font-size:16px;margin:0 0 1px}
.rhtp .tip .sub{font-size:12px;color:var(--ink3);margin-bottom:8px}
.rhtp .tip .big{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
.rhtp .tip .biglab{font-size:12px;color:var(--ink2);margin-bottom:8px}
.rhtp .tip dl{display:grid;grid-template-columns:1fr auto;gap:3px 14px;margin:0;padding-top:8px;border-top:1px solid var(--rule);font-size:12.5px}
.rhtp .tip dt{color:var(--ink2)}
.rhtp .tip dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.rhtp .src{border-top:1px solid var(--rule);margin-top:12px;padding-top:9px;font-size:11.5px;color:var(--ink3);line-height:1.5}
.rhtp .state{stroke:var(--bg);stroke-width:1;cursor:pointer;transition:opacity .15s}
.rhtp .state.dim{opacity:.18}
.rhtp .state.hot{stroke:var(--ink);stroke-width:1.6}
.rhtp .dot{stroke:var(--bg);stroke-width:1.2;transition:r .1s}
.rhtp .bar{cursor:pointer}
.rhtp .barrow.hot rect.bar{opacity:.78}
.rhtp .barrow.hot text.nm{fill:var(--ink);font-weight:600}
.rhtp :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:560px){.rhtp{padding:16px 14px 12px}.rhtp h1{font-size:21px}.rhtp-tabs{gap:18px}.rhtp .takeaway{font-size:16px}}
</style>
</head>

  chg:{label:'Change, Year 1 to Year 2 ($)',fmt:function(v){return (v>0?'+':v<0?'−':'')+'$'+Math.abs(v).toFixed(1)+'M';},short:'Change from Year 1',kind:'div'},
  prr:{label:'Year 1 dollars per rural resident',fmt:dollars,short:'Per rural resident',kind:'seq',log:true},
  pr:{label:'Year 1 dollars per resident',fmt:dollars,short:'Per resident',kind:'seq',log:true},
  ob:{label:'Share of Year 1 obligated by Jul 31, 2026',fmt:function(v){return v.toFixed(0)+'%';},short:'Obligated by Jul 31',kind:'seq'},
  rur:{label:'Rural residents',fmt:people,short:'Rural residents',log:true},
  pop:{label:'Total residents',fmt:people,short:'Total residents',log:true},
  rp:{label:'Rural share of population',fmt:function(v){return v.toFixed(1)+'%';},short:'Rural share'},
  mc:{label:'Residents covered by Medicaid',fmt:function(v){return v.toFixed(1)+'%';},short:'Medicaid coverage'},
  area:{label:'Land area',fmt:function(v){return Math.round(v/1000).toLocaleString('en-US')+'K sq km';},short:'Land area',log:true}
};
var st={tab:'map',gov:'all',mapMetric:'y2',x:'rur',y:'y1',colorBy:'party',barMetric:'chg',show:'top'};
/* ---------- helpers ---------- */
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function h(tag,cls,txt,parent){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(parent)parent.appendChild(e);return e;}
function css(v){return getComputedStyle(root).getPropertyValue(v).trim();}
function dark(){return root.getAttribute('data-theme')==='dark';}
function hex(c){c=c.replace('#','');return [parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)];}
function mix(a,b,t){a=hex(a);b=hex(b);return 'rgb('+a.map(function(x,i){return Math.round(x+(b[i]-x)*t);}).join(',')+')';}
function ramp(stops,t){t=Math.max(0,Math.min(1,t));var n=stops.length-1,i=Math.min(n-1,Math.floor(t*n));return mix(stops[i],stops[i+1],t*n-i);}
function seqStops(){return dark()?['#1d2a3a','#27456b','#3470ad','#6aa9ea','#b9d8fa']:['#e6eef8','#b3cdea','#6f9fd3','#2f6fb5','#0b3564'];}
function divStops(){return dark()?['#e8935a','#8a5a3c','#383835','#3f6da3','#6aa9ea']:['#c2540a','#eeb383','#eceef0','#8db6e2','#1456a0'];}
function visible(r){return st.gov==='all'||r.gov===st.gov;}
function colorFor(metric,v,ext){var m=M[metric];
  if(m.kind==='div'){var lim=ext.lim;return ramp(divStops(),0.5+0.5*v/lim);}
  var a=ext.min,b=ext.max;if(m.log){v=Math.log(v);a=Math.log(a);b=Math.log(b);}return ramp(seqStops(),(v-a)/(b-a));}
function extent(metric){var vs=S.map(function(r){return r[metric];});var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);return {min:mn,max:mx,lim:Math.max(Math.abs(mn),Math.abs(mx))};}
function rank(a){var idx=a.map(function(v,i){return [v,i];}).sort(function(p,q){return p[0]-q[0];}),r=[];idx.forEach(function(p,i){r[p[1]]=i;});return r;}
function pearson(x,y){var n=x.length,mx=0,my=0,i;for(i=0;i<n;i++){mx+=x[i];my+=y[i];}mx/=n;my/=n;var sxy=0,sx=0,sy=0;for(i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my);sx+=(x[i]-mx)*(x[i]-mx);sy+=(y[i]-my)*(y[i]-my);}return sxy/Math.sqrt(sx*sy);}
function strength(r){r=Math.abs(r);return r<0.15?'no':r<0.3?'a weak':r<0.6?'a moderate':'a strong';}
function ticks(a,b,n){var span=b-a,step=Math.pow(10,Math.floor(Math.log10(span/n))),e=span/n/step;step*=e>=5?5:e>=2?2:1;var t=[],v=Math.ceil(a/step)*step;for(;v<=b+1e-9;v+=step)t.push(+v.toFixed(6));return t;}
function logTicks(a,b){var t=[],p=Math.floor(Math.log10(a));for(;Math.pow(10,p)<=b*1.001;p++){[1,2,5].forEach(function(k){var v=k*Math.pow(10,p);if(v>=a*0.999&&v<=b*1.001)t.push(v);});}return t;}
/* ---------- tooltip ---------- */
function showTip(r,metric,evt,extra){
  tip.textContent='';
  h('h3',null,r.n,tip);
  h('div','sub',partyName(r.gov)+' governor · '+people(r.pop)+' residents',tip);
  h('div','big',M[metric].fmt(r[metric]),tip);
  h('div','biglab',M[metric].short,tip);
  var dl=h('dl',null,null,tip);
  var rows=[['Year 1 award',money(r.y1)],['Year 2 award',money(r.y2)],['Change',M.chg.fmt(r.chg)+' ('+M.chgp.fmt(r.chgp)+')'],['Rural residents',people(r.rur)+' ('+r.rp.toFixed(0)+'%)'],['Per rural resident',dollars(r.prr)],['Medicaid coverage',r.mc.toFixed(0)+'%']];
  (extra||[]).concat(rows).forEach(function(p){h('dt',null,p[0],dl);h('dd',null,p[1],dl);});
  var box=stage.getBoundingClientRect(),x=evt.clientX-box.left,y=evt.clientY-box.top;
  tip.classList.add('on');
  var tw=tip.offsetWidth,th=tip.offsetHeight,left=x+16,top=y-th/2;
  if(left+tw>box.width-4)left=x-tw-16; if(left<0)left=4;
  top=Math.max(0,Math.min(top,Math.max(0,stage.offsetHeight-th)));
  tip.style.left=left+'px';tip.style.top=top+'px';
}
function hideTip(){tip.classList.remove('on');}
/* ---------- controls ---------- */
function select(label,key,opts){var l=h('label',null,label),s=h('select',null,null,l);opts.forEach(function(k){var o=h('option',null,M[k]?M[k].label:k[1],s);o.value=M[k]?k:k[0];});s.value=st[key];s.addEventListener('change',function(){st[key]=s.value;render();});return l;}
function seg(label,key,opts){var l=h('label',null,label),g=h('span','seg',null,l);opts.forEach(function(o){var b=h('button',null,o[1],g);b.type='button';b.setAttribute('aria-pressed',st[key]===o[0]);b.addEventListener('click',function(){st[key]=o[0];render();});});return l;}
function controls(){var c=document.getElementById('controls');c.textContent='';
  if(st.tab==='map')c.appendChild(select('Show','mapMetric',['y2','y1','chgp','prr','ob']));
  if(st.tab==='scatter'){c.appendChild(select('Compare awards with','x',['rur','pop','rp','mc','area']));c.appendChild(select('Award','y',['y1','y2']));c.appendChild(seg('Color','colorBy',[['party','Governor’s party'],['none','None']]));}
  if(st.tab==='bars'){c.appendChild(select('Rank states by','barMetric',['chg','chgp','y2','y1','prr','ob']));c.appendChild(seg('Show','show',[['top','Top 10'],['bottom','Bottom 10'],['all','All states']]));}
  c.appendChild(seg('Governor','gov',[['all','All'],['R','Republican'],['D','Democratic']]));
}
function setText(id,t){document.getElementById(id).textContent=t;}
function clearStage(){Array.prototype.slice.call(stage.children).forEach(function(n){if(n!==tip)stage.removeChild(n);});hideTip();}
/* ---------- map ---------- */
function drawMap(){
  var metric=st.mapMetric,ext=extent(metric),m=M[metric];
  var svg=el('svg',{viewBox:'0 0 '+DATA.W+' '+DATA.H,role:'img','aria-label':'Map of the United States shaded by '+m.label},stage);
  S.forEach(function(r){
    var p=el('path',{d:DATA.paths[r.a],fill:colorFor(metric,r[metric],ext),'class':'state'+(visible(r)?'':' dim'),tabindex:0,'aria-label':r.n+', '+m.fmt(r[metric])},svg);
    function on(e){p.classList.add('hot');svg.appendChild(p);showTip(r,metric,e);}
    p.addEventListener('pointermove',on);p.addEventListener('pointerleave',function(){p.classList.remove('hot');hideTip();});
    p.addEventListener('focus',function(){var b=p.getBoundingClientRect();on({clientX:b.left+b.width/2,clientY:b.top+b.height/2});});p.addEventListener('blur',function(){p.classList.remove('hot');hideTip();});
  });
  var vis=S.filter(visible),hi=vis.slice().sort(function(a,b){return b[metric]-a[metric];})[0],lo=vis.slice().sort(function(a,b){return a[metric]-b[metric];})[0];
  var t={y2:'Texas received about twice what New Jersey did in Year 2',y1:'Year 1 awards ranged from $147 million to $281 million',chgp:'No state’s award moved more than 4% in Year 2',prr:'Small states received far more per rural resident',ob:'States committed Year 1 money at very different speeds'}[metric];
  setText('takeaway',t);
  setText('note','Highest'+(st.gov==='all'?'':' among '+partyName(st.gov)+'-governed states')+': '+hi.n+' ('+m.fmt(hi[metric])+'). Lowest: '+lo.n+' ('+m.fmt(lo[metric])+'). Hover or tap a state for detail.');
  var lg=document.getElementById('legend');lg.textContent='';
  var stops=m.kind==='div'?divStops():seqStops();
  h('span',null,m.kind==='div'?M[metric].fmt(-ext.lim):m.fmt(ext.min),lg);
  var rp=h('span','ramp',null,lg);for(var i=0;i<24;i++){var s=h('i',null,null,rp);s.style.background=ramp(stops,i/23);}
  h('span',null,m.kind==='div'?M[metric].fmt(ext.lim):m.fmt(ext.max)+(m.log?' (log scale)':''),lg);
  setText('src',{ob:'Source: CMS, RHTP Obligated Funds Report (state-reported data as of Jul 31, 2026); CMS Year 1 awards. Analysis: Kamen Partners.',prr:'Sources: CMS Year 1 awards (Dec 29, 2025); Census Bureau, 2020 rural population. CMS uses a different rural definition (HRSA). Analysis: Kamen Partners.'}[metric]||'Source: CMS award announcements, Dec 29, 2025 and Nov 9, 2026. Analysis: Kamen Partners.');
}
/* ---------- scatter ---------- */
function drawScatter(){
  var xk=st.x,yk=st.y,mx=M[xk],my=M[yk],rows=S.filter(visible);
  var W=940,H=500,mg={l:58,r:26,t:16,b:50},iw=W-mg.l-mg.r,ih=H-mg.t-mg.b;
  var svg=el('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Scatter plot of '+my.label+' against '+mx.label},stage);
  var xs=S.map(function(r){return r[xk];}),ys=S.map(function(r){return r[yk];});
  var xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs),ymin=130,ymax=290;
  var tx=mx.log?Math.log:function(v){return v;};
  var pad=(tx(xmax)-tx(xmin))*0.04,xa=tx(xmin)-pad,xb=tx(xmax)+pad;
  function X(v){return mg.l+(tx(v)-xa)/(xb-xa)*iw;} function Y(v){return mg.t+ih-(v-ymin)/(ymax-ymin)*ih;}
  [150,200,250].forEach(function(v){el('line',{x1:mg.l,x2:W-mg.r,y1:Y(v),y2:Y(v),stroke:css('--rule')},svg);var t=el('text',{x:mg.l-10,y:Y(v)+4,'text-anchor':'end'},svg);t.textContent='$'+v+'M';});
  var xt=mx.log?logTicks(Math.exp(xa),Math.exp(xb)):ticks(xa,xb,6);
  if(mx.log&&xt.length>9)xt=xt.filter(function(v){return /^1|^5/.test(String(v/Math.pow(10,Math.floor(Math.log10(v)))));});
  xt.forEach(function(v){el('line',{x1:X(v),x2:X(v),y1:mg.t+ih,y2:mg.t+ih+5,stroke:css('--ink3')},svg);var t=el('text',{x:X(v),y:mg.t+ih+20,'text-anchor':'middle'},svg);
    t.textContent=(xk==='rur'||xk==='pop')?(v>=1e6?(v/1e6)+'M':(v/1e3)+'K'):xk==='area'?Math.round(v/1000)+'K':v+'%';});
  el('line',{x1:mg.l,x2:W-mg.r,y1:mg.t+ih,y2:mg.t+ih,stroke:css('--ink3')},svg);
  var xl=el('text',{x:mg.l+iw/2,y:H-8,'text-anchor':'middle'},svg);xl.textContent=mx.label+(xk==='area'?' (sq km)':'')+(mx.log?', log scale':'');
  var r=NaN;
  if(rows.length>3){
    var fx=rows.map(function(d){return tx(d[xk]);}),fy=rows.map(function(d){return d[yk];});
    r=pearson(rank(fx),rank(fy));
    var n=fx.length,mxx=fx.reduce(function(a,b){return a+b;},0)/n,myy=fy.reduce(function(a,b){return a+b;},0)/n,num=0,den=0;
    fx.forEach(function(v,i){num+=(v-mxx)*(fy[i]-myy);den+=(v-mxx)*(v-mxx);});var b=num/den,a=myy-b*mxx;
    el('line',{x1:mg.l,x2:W-mg.r,y1:Y(a+b*xa),y2:Y(a+b*xb),stroke:css('--ink3'),'stroke-width':1.5,'stroke-dasharray':'5 4'},svg);
  }
  var labelSet={TX:1,AK:1,CA:1,MT:1,NJ:1,RI:1,LA:1};
  var dots=rows.map(function(d){
    var c=st.colorBy==='party'?css(d.gov==='R'?'--rep':'--dem'):css('--accent');
    var g={d:d,x:X(d[xk]),y:Y(d[yk])};
    g.node=el('circle',{cx:g.x,cy:g.y,r:5.5,fill:c,'class':'dot','fill-opacity':.9},svg);
    if(labelSet[d.a]){var t=el('text',{x:g.x+9,y:g.y+4,'font-weight':600},svg);t.textContent=d.a;t.style.fill=css('--ink');if(g.x>W-70){t.setAttribute('x',g.x-9);t.setAttribute('text-anchor','end');}}
    return g;});
  var hit=el('rect',{x:0,y:0,width:W,height:H,fill:'transparent'},svg),cur=null;
  hit.addEventListener('pointermove',function(e){var b=svg.getBoundingClientRect(),k=W/b.width,px=(e.clientX-b.left)*k,py=(e.clientY-b.top)*k,best=null,bd=1e9;
    dots.forEach(function(g){var dd=(g.x-px)*(g.x-px)+(g.y-py)*(g.y-py);if(dd<bd){bd=dd;best=g;}});
    if(cur&&cur!==best){cur.node.setAttribute('r',5.5);cur.node.setAttribute('stroke',css('--bg'));}
    if(best&&bd<45*45){cur=best;best.node.setAttribute('r',8);best.node.setAttribute('stroke',css('--ink'));showTip(best.d,yk,e,[[mx.short,mx.fmt(best.d[xk])]]);}else{hideTip();cur=null;}});
  hit.addEventListener('pointerleave',function(){if(cur){cur.node.setAttribute('r',5.5);cur.node.setAttribute('stroke',css('--bg'));cur=null;}hideTip();});
  var head={rur:'Awards rise with rural population, but loosely',pop:'Bigger states did not get bigger awards',rp:'More rural states received somewhat more',mc:'Medicaid coverage has no bearing on awards',area:'Land area is the strongest single predictor'}[xk];
  setText('takeaway',head);
  setText('note',isNaN(r)?'Too few states to measure a relationship.':'Among the '+rows.length+' states shown there is '+strength(r)+' relationship (rank correlation '+sign(r,2)+'). Each dot is a state; the dashed line is the trend.');
  var lg=document.getElementById('legend');lg.textContent='';
  if(st.colorBy==='party'){[['R','Republican governor','--rep'],['D','Democratic governor','--dem']].forEach(function(p){if(st.gov!=='all'&&st.gov!==p[0])return;var k=h('span','key',null,lg),b=h('b',null,null,k);b.style.background=css(p[2]);h('span',null,p[1],k);});}
  setText('src','Sources: CMS award announcements; Census Bureau (2025 population estimates, 2020 rural counts); KFF State Health Facts (Medicaid coverage, 2024); governors as of January 2026. Analysis: Kamen Partners.');
}
/* ---------- bars ---------- */
function drawBars(){
  var metric=st.barMetric,m=M[metric],rows=S.filter(visible).sort(function(a,b){return b[metric]-a[metric];});
  var n=rows.length;
  if(st.show==='top')rows=rows.slice(0,10); else if(st.show==='bottom')rows=rows.slice(-10).reverse();
  var wrap=h('div','barwrap',null,stage);
  var W=940,rh=30,H=rows.length*rh+8,lw=150,vw=150,iw=W-lw-vw;
  var svg=el('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Bar chart of states ranked by '+m.label},null);wrap.appendChild(svg);
  var div=m.kind==='div',vals=S.map(function(r){return r[metric];}),mxv=Math.max.apply(null,vals.map(Math.abs));
  var zero=div?lw+iw/2:lw;
  function w(v){return Math.abs(v)/mxv*(div?iw/2:iw);}
  if(div)el('line',{x1:zero,x2:zero,y1:0,y2:H,stroke:css('--ink3')},svg);
  rows.forEach(function(r,i){
    var y=i*rh+4,v=r[metric],g=el('g',{'class':'barrow',tabindex:0,'aria-label':r.n+', '+m.fmt(v)},svg);
    var nm=el('text',{x:lw-12,y:y+rh/2+1,'text-anchor':'end','class':'nm','font-size':13},g);nm.textContent=r.n;
    el('rect',{x:lw,y:y+3,width:iw,height:rh-10,fill:css('--soft'),rx:3},g);
    var bw=Math.max(w(v),2),bx=div&&v<0?zero-bw:zero;
    var fill=div?css(v>=0?'--gain':'--loss'):css('--accent');
    el('rect',{x:bx,y:y+3,width:bw,height:rh-10,fill:fill,rx:3,'class':'bar'},g);
    var vt=el('text',{x:lw+iw+12,y:y+rh/2+1,'font-size':13,'font-weight':600},g);vt.textContent=m.fmt(v)+(metric==='chg'?'  ('+M.chgp.fmt(r.chgp)+')':'');vt.style.fill=css('--ink');
    var hitr=el('rect',{x:0,y:y,width:W,height:rh,fill:'transparent','class':'bar'},g);
    function on(e){g.classList.add('hot');showTip(r,metric,e);}
    hitr.addEventListener('pointermove',on);hitr.addEventListener('pointerleave',function(){g.classList.remove('hot');hideTip();});
    g.addEventListener('focus',function(){var b=g.getBoundingClientRect();on({clientX:b.left+b.width/2,clientY:b.top+b.height/2});});g.addEventListener('blur',function(){g.classList.remove('hot');hideTip();});
  });
  var which=st.show==='top'?'Top '+rows.length:st.show==='bottom'?'Bottom '+rows.length:'All '+rows.length;
  var head={chg:'North Dakota gained most in Year 2; Florida lost most',chgp:'Year 2 changes stayed within 4% in either direction',y2:'Texas and Alaska lead Year 2 awards',y1:'Texas and Alaska led Year 1 awards',prr:'Rhode Island received 27 times more per rural resident than Texas',ob:'3 states had obligated all Year 1 funds by Jul 31; 2 had obligated none'}[metric];
  setText('takeaway',head);
  setText('note',which+' of '+n+(st.gov==='all'?'':' '+partyName(st.gov)+'-governed')+' states, ranked by '+m.label.charAt(0).toLowerCase()+m.label.slice(1)+'.');
  document.getElementById('legend').textContent='';
  if(div){var lg=document.getElementById('legend');[['Gain','--gain'],['Loss','--loss']].forEach(function(p){var k=h('span','key',null,lg),b=h('b',null,null,k);b.style.background=css(p[1]);b.style.borderRadius='2px';h('span',null,p[0],k);});}
  setText('src',{ob:'Source: CMS, RHTP Obligated Funds Report (state-reported data as of Jul 31, 2026). Analysis: Kamen Partners.',prr:'Sources: CMS Year 1 awards; Census Bureau, 2020 rural population. Analysis: Kamen Partners.'}[metric]||'Source: CMS award announcements, Dec 29, 2025 and Nov 9, 2026. Analysis: Kamen Partners.');
}
/* ---------- render ---------- */
function render(){controls();clearStage();
  Array.prototype.forEach.call(root.querySelectorAll('[role=tab]'),function(b){b.setAttribute('aria-selected',b.getAttribute('data-tab')===st.tab);});
  if(st.tab==='map')drawMap();else if(st.tab==='scatter')drawScatter();else drawBars();
  if(window.parent!==window){try{window.parent.postMessage({rhtpHeight:document.documentElement.scrollHeight},'*');}catch(e){}}
}
Array.prototype.forEach.call(root.querySelectorAll('[role=tab]'),function(b){b.addEventListener('click',function(){st.tab=b.getAttribute('data-tab');render();});});
var q=new URLSearchParams(location.search),th=q.get('theme');
if(th!=='light'&&th!=='dark')th='light';
if(q.get('tab')&&{map:1,scatter:1,bars:1}[q.get('tab')])st.tab=q.get('tab');
var tb=document.getElementById('themeBtn');
function setTheme(t){root.setAttribute('data-theme',t);tb.textContent=t==='dark'?'Light':'Dark';document.body.style.background=q.get('bg')==='transparent'?'transparent':css('--bg');render();}
tb.addEventListener('click',function(){setTheme(dark()?'light':'dark');});
setTheme(th);
})();
</script>
